name: WithCrypt
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libdbus-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'cryptography>=44' pycryptodome
      - run: python tests/fixtures/check_vectors.py
      - run: cargo build --release --workspace --locked
      - if: runner.os != 'Windows'
        run: python tests/cli_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: WithCrypt-${{ matrix.os }}
          path: |
            LICENSE
            target/release/withcrypt
            target/release/withcrypt-gui
            target/release/withcrypt.exe
            target/release/withcrypt-gui.exe
            target/release/withcrypt_shell.dll
            target/release/withcrypt-setup.exe
  # 32-bit x86 and ARM64 Windows builds (x64 is covered by the test job).
  # x86 runs natively on x64 runners; ARM64 builds and tests on an ARM runner.
  windows-arch:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            target: i686-pc-windows-msvc
            runner: windows-latest
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - run: cargo build --release --workspace --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: WithCrypt-windows-${{ matrix.arch }}
          path: |
            LICENSE
            target/${{ matrix.target }}/release/withcrypt.exe
            target/${{ matrix.target }}/release/withcrypt-gui.exe
            target/${{ matrix.target }}/release/withcrypt_shell.dll
            target/${{ matrix.target }}/release/withcrypt-setup.exe
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
